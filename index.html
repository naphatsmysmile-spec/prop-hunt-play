<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PROP HUNT — เข้าเกม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%8E%AD</text></svg>" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    display:grid;place-items:center;padding:24px;
    font-family:"Noto Sans Thai","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#e8edf5;
    background:
      radial-gradient(900px 500px at 50% -10%,#1b2434 0%,transparent 70%),
      linear-gradient(180deg,#0b0e13,#070a0e);
  }
  .card{width:min(460px,100%);text-align:center}
  h1{
    margin:0 0 6px;font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:.12em;
    background:linear-gradient(100deg,#ff6b4a,#ffcc44 40%,#4ad6a0 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:0 0 28px;color:#8b97ab;font-size:14px}
  .spinner{
    width:40px;height:40px;margin:0 auto 18px;border-radius:50%;
    border:4px solid rgba(255,255,255,.14);border-top-color:#4ad6a0;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{font-size:15px;min-height:24px}
  .muted{color:#8b97ab;font-size:13px;margin-top:10px;line-height:1.7}
  button{
    margin-top:20px;padding:14px 26px;width:100%;
    font-size:17px;font-weight:700;font-family:inherit;color:#071018;cursor:pointer;
    background:linear-gradient(100deg,#4ad6a0,#39b7e8);border:0;border-radius:12px;
  }
  button:hover{filter:brightness(1.08)}
  button.ghost{background:rgba(255,255,255,.08);color:#cfd8e4;border:1px solid rgba(255,255,255,.14);font-size:14px;padding:11px}
  .down{color:#ffcc44}
  code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>PROP&nbsp;HUNT</h1>
  <p class="sub">แปลงร่างเป็นของในฉาก · หลบให้รอด · หรือออกล่า</p>

  <div id="spin" class="spinner"></div>
  <div class="msg" id="msg">กำลังหาเซิร์ฟเวอร์…</div>
  <div class="muted" id="hint"></div>

  <button id="go" hidden>เข้าเกม</button>
  <button id="retry" class="ghost" hidden>ลองใหม่</button>
</div>

<script>
// The game server runs on a temporary tunnel whose address changes. This page
// is the one address that never changes: it reads the current target from
// server.json and forwards you there.
const $ = (id) => document.getElementById(id);

async function currentTarget() {
  const res = await fetch('server.json?t=' + Date.now(), { cache: 'no-store' });
  const data = await res.json();
  return String(data.url || '').replace(/\/+$/, '');
}

function withQuery(base) {
  // keep ?room=... so invite links still land in the right room
  return base + '/' + (location.search || '');
}

async function reachable(base) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const res = await fetch(base + '/health?t=' + Date.now(), {
      cache: 'no-store', signal: ctrl.signal,
    });
    return res.ok;
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function run() {
  $('spin').hidden = false;
  $('go').hidden = true;
  $('retry').hidden = true;
  $('hint').textContent = '';
  $('msg').textContent = 'กำลังหาเซิร์ฟเวอร์…';

  let target;
  try {
    target = await currentTarget();
  } catch {
    $('spin').hidden = true;
    $('msg').innerHTML = '<span class="down">อ่านที่อยู่เซิร์ฟเวอร์ไม่ได้</span>';
    $('retry').hidden = false;
    return;
  }

  if (await reachable(target)) {
    $('msg').textContent = 'เจอแล้ว กำลังพาเข้าเกม…';
    location.replace(withQuery(target));
    return;
  }

  $('spin').hidden = true;
  $('msg').innerHTML = '<span class="down">เซิร์ฟเวอร์ยังไม่เปิด</span>';
  $('hint').innerHTML =
    'เกมรันอยู่บนเครื่องของเจ้าของห้อง — ต้องเปิดเครื่องและเปิดเกมไว้<br>' +
    'ลองใหม่อีกครั้งได้ หรือทักเจ้าของห้องให้เปิดให้';
  $('go').hidden = false;
  $('go').textContent = 'เข้าทั้งที่ยังไม่พร้อม';
  $('go').onclick = () => location.replace(withQuery(target));
  $('retry').hidden = false;
}

$('retry').onclick = run;
run();
</script>
</body>
</html>
